[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checklists-engine"
version = "0.3.0"
requires-python = ">=3.12"
description = "Synchronous execution of authenticated checklist bundles"
readme = "README.md"
dependencies = ["cryptography==50.0.2"]

[project.optional-dependencies]
test = ["black==25.9.0", "mypy==2.4.1", "pytest==8.4.2", "ruff==0.17.5"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["contracts", "crypto", "engine", "vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
addopts = "--strict-config --strict-markers"

[tool.black]
required-version = "25.9.0"
target-version = ["py312"]
line-length = 79

[tool.mypy]
python_version = "3.12"
files = ["src", "examples", "tests"]
mypy_path = ["src", "examples"]
strict = true
warn_unreachable = true
strict_equality_for_none = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
# Follow Black and PEP 257. Keep licence notices in LICENSE.
# Keep exception messages at their raise sites.
ignore = ["COM812", "CPY001", "D203", "D213", "EM101", "EM102", "TRY003"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# The standalone example prints its results.
"examples/example.py" = ["INP001", "T201"]
# Standalone tests use explicit expectations and inspect internals.
"tests/*.py" = ["ARG002", "D", "FBT001", "INP001", "PLR2004", "S101", "SLF001"]
